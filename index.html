  /* Settings Button Styling */
#settings-toggle {
  position: fixed;
  bottom: 15px; /* Moved from top to bottom */
  right: 15px;
  z-index: 100;
  background: rgba(0, 0, 0, 0.6);
  border: 1px solid var(--accent);

  width: 45px;

  cursor: pointer;
  display: grid;

  background: rgba(255, 23, 68, 0.3);
}

/* Lite Mode Overrides */

body.lite-mode .floating,
body.lite-mode #vortx-robot,
body.lite-mode .background::before,
body.lite-mode .background::after {
  display: none !important;
}

/* Remove expensive blurs and animations in Lite Mode */
body.lite-mode .profile-card {
  animation: none !important;
  backdrop-filter: none !important;
  -webkit-backdrop-filter: none !important;
  background: rgba(15, 5, 8, 0.98) !important; /* Solid fallback background */
}
body.lite-mode * {
  animation-duration: 0.01ms !important; /* Kills all remaining CSS animations */
}

  <script>
(() => {
  'use strict';

  /* =========================================================
     RAVI LIVE EFFECTS / MESH PARTICLE SYSTEM
     ========================================================= */

  const WHATSAPP_GROUP_URL =
    'https://chat.whatsapp.com/CU9n2iZgGIFAbc75vWQhMG';

  const counterEndpoint =
    'https://api.counterapi.dev/v1/vortx_official_page/total_visits/up';

  const reduced =
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------------------------------------------------------
     DOM
     --------------------------------------------------------- */

  const canvas =
    document.querySelector('#particle-canvas');

  const ctx =
    canvas ? canvas.getContext('2d') : null;

  const cardCanvas =
    document.querySelector('#card-canvas');

  const cardCtx =
    cardCanvas ? cardCanvas.getContext('2d') : null;

  const settingsBtn =
    document.querySelector('#settings-toggle');

  const background =
    document.querySelector('.background');

  const flash =
    document.querySelector('#flash');

  const energyElements =
    document.querySelectorAll('.energy');

  /* ---------------------------------------------------------
     Make the background layers visible
     --------------------------------------------------------- */

  if (background) {
    background.style.zIndex = '0';
  }

  if (canvas) {
    canvas.style.zIndex = '1';
  }

  energyElements.forEach(el => {
    el.style.zIndex = '1';
  });

  /* ---------------------------------------------------------
     Settings storage
     --------------------------------------------------------- */

  const STORAGE_KEY =
    'vortx-effects-settings-v3';

const DEFAULT_SETTINGS = {
  backgroundParticles: false,
  backgroundDensity: 180,

  cardParticles: false,

  energyStreaks: false,

  floatingGraphics: true,

  robot: true,

  ambientGlow: false,

  uiAnimations: true
};

  let settings = {
    ...DEFAULT_SETTINGS
  };

  try {
    const saved =
      localStorage.getItem(STORAGE_KEY);

    if (saved) {
      const parsed =
        JSON.parse(saved);

      if (
        parsed &&
        typeof parsed === 'object'
      ) {
        settings = {
          ...DEFAULT_SETTINGS,
          ...parsed
        };
      }
    }
  } catch {
    settings = {
      ...DEFAULT_SETTINGS
    };
  }

  /* Safety limits for stored density */

  settings.backgroundDensity =
    Math.max(
      40,
      Math.min(
        300,
        Number(settings.backgroundDensity) || 180
      )
    );

  function saveSettings() {
    try {
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(settings)
      );
    } catch {
      /* Storage unavailable - page still works */
    }
  }

  /* ---------------------------------------------------------
     Canvas state
     --------------------------------------------------------- */

  let width = 0;
  let height = 0;
  let dpr = 1;

  let particles = [];
  let cardDots = [];

  let particleFrame = null;
  let cardFrame = null;

  /* ---------------------------------------------------------
     Mouse interaction
     --------------------------------------------------------- */

  const mouse = {
    x: -9999,
    y: -9999,
    active: false
  };

  /* ---------------------------------------------------------
     Mesh particle creation
     --------------------------------------------------------- */

  function createParticle() {
    const depth =
      0.45 + Math.random() * 0.85;

    return {
      x: Math.random() * width,
      y: Math.random() * height,

      vx:
        (Math.random() - 0.5) *
        0.30 *
        depth,

      vy:
        (Math.random() - 0.5) *
        0.27 *
        depth,

      radius:
        (0.7 + Math.random() * 1.45) *
        depth,

      alpha:
        0.28 +
        Math.random() * 0.5,

      depth,

      pulse:
        Math.random() * Math.PI * 2
    };
  }

  /* ---------------------------------------------------------
     Create mesh
     --------------------------------------------------------- */

  function rebuildParticles() {
    if (
      !canvas ||
      !ctx ||
      reduced ||
      !settings.backgroundParticles
    ) {
      particles = [];
      return;
    }

    particles =
      Array.from(
        {
          length:
            Math.round(
              settings.backgroundDensity
            )
        },
        createParticle
      );
  }

  /* ---------------------------------------------------------
     Resize background canvas
     --------------------------------------------------------- */

  function resizeParticles() {
    if (!canvas || !ctx) {
      return;
    }

    dpr =
      Math.min(
        window.devicePixelRatio || 1,
        2
      );

    width =
      window.innerWidth;

    height =
      window.innerHeight;

    canvas.width =
      Math.floor(
        width * dpr
      );

        height * dpr
      );

    canvas.style.width =
      `${width}px`;

    canvas.style.height =
      `${height}px`;

    ctx.setTransform(
      dpr,
      0,
      0,
      dpr,
      0,
      0
    );

    rebuildParticles();
  }

  /* ---------------------------------------------------------
     Mesh animation
     --------------------------------------------------------- */

  function animateParticles() {
    if (
      reduced ||
      !settings.backgroundParticles ||
      !canvas ||
      !ctx
    ) {
      particleFrame = null;
      return;
    }

    ctx.clearRect(
      0,
      0,
      width,
      height
    );

    const connectionDistance =
      width >= 1500
        ? 185
        : width >= 1000
        ? 165
        : 145;

    const connectionDistanceSquared =
      connectionDistance *
      connectionDistance;

    /* ---------------------------------------------
       Move particles
       --------------------------------------------- */

    particles.forEach(p => {
      if (mouse.active) {
        const dx =
          p.x - mouse.x;

        const dy =
          p.y - mouse.y;

        const distance =
          Math.hypot(
            dx,
            dy
          );

        if (
          distance < 180 &&
          distance > 1
        ) {
          const force =
            (1 - distance / 180) *
            0.010;

          p.vx +=
            (dx / distance) *
            force;

          p.vy +=
            (dy / distance) *
            force;
        }
      }

      p.x += p.vx;
      p.y += p.vy;

      p.vx *= 0.999;
      p.vy *= 0.999;

      /* Keep movement alive */

      if (
        Math.abs(p.vx) < 0.012
      ) {
        p.vx +=
          (Math.random() - 0.5) *
          0.002;
      }

      if (
        Math.abs(p.vy) < 0.012
      ) {
        p.vy +=
          (Math.random() - 0.5) *
          0.002;
      }

      /* Screen wrapping */

      if (p.x < -20) {
        p.x = width + 20;
      }

      if (p.x > width + 20) {
        p.x = -20;
      }

      if (p.y < -20) {
        p.y = height + 20;
      }

      if (p.y > height + 20) {
        p.y = -20;
      }

      p.pulse += 0.018;
    });

    /* ---------------------------------------------
       Draw mesh connections first
       --------------------------------------------- */

    for (
      let i = 0;
      i < particles.length;
      i++
    ) {
      const p =
        particles[i];

      for (
        let j = i + 1;
        j < particles.length;
        j++
      ) {
        const q =
          particles[j];

        const dx =
          p.x - q.x;

        const dy =
          p.y - q.y;

        const distanceSquared =
          dx * dx +
          dy * dy;

        if (
          distanceSquared <
          connectionDistanceSquared
        ) {
          const distance =
            Math.sqrt(
              distanceSquared
            );

          const strength =
            1 -
            distance /
              connectionDistance;

          ctx.beginPath();

          ctx.lineWidth =
            0.35 +
            strength * 0.45;

          ctx.strokeStyle =
            `rgba(255,28,66,${
              strength * 0.27
            })`;

          ctx.moveTo(
            p.x,
            p.y
          );

          ctx.lineTo(
            q.x,
            q.y
          );

          ctx.stroke();
        }
      }
    }

    /* ---------------------------------------------
       Draw particles
       --------------------------------------------- */

    particles.forEach(p => {
      const pulse =
        1 +
        Math.sin(p.pulse) *
        0.15;

      ctx.beginPath();

      ctx.fillStyle =
        `rgba(255,32,68,${p.alpha})`;

      ctx.shadowColor =
        '#ff003c';

      ctx.shadowBlur =
        8 * p.depth;

      ctx.arc(
        p.x,
        p.y,
        p.radius * pulse,
        0,
        Math.PI * 2
      );

      ctx.fill();
    });

    ctx.shadowBlur = 0;

    particleFrame =
      requestAnimationFrame(
        animateParticles
      );
  }

  function startParticleAnimation() {
    if (
      reduced ||
      !settings.backgroundParticles ||
      particleFrame !== null
    ) {
      return;
    }

    particleFrame =
      requestAnimationFrame(
        animateParticles
      );
  }

  function stopParticleAnimation() {
    if (
      particleFrame !== null
    ) {
      cancelAnimationFrame(
        particleFrame
      );

      particleFrame = null;
    }

    particles = [];

    if (ctx) {
      ctx.clearRect(
        0,
        0,
        width,
        height
      );
    }
  }

  /* ---------------------------------------------------------
     Card mesh particles
     --------------------------------------------------------- */

  function resizeCard() {
    if (
      !cardCanvas ||
      !cardCtx
    ) {
      return;
    }

    const rect =
      cardCanvas.getBoundingClientRect();

    const ratio =
      Math.min(
        window.devicePixelRatio || 1,
        2
      );

    cardCanvas.width =
      Math.floor(
        rect.width * ratio
      );

    cardCanvas.height =
      Math.floor(
        rect.height * ratio
      );

    cardCtx.setTransform(
      ratio,
      0,
      0,
      ratio,
      0,
      0
    );

    if (
      reduced ||
      !settings.cardParticles
    ) {
      cardDots = [];

      cardCtx.clearRect(
        0,
        0,
        rect.width,
        rect.height
      );

      return;
    }

    cardDots =
      Array.from(
        {
          length: 17
        },
        () => ({
          x:
            Math.random() *
            rect.width,

          y:
            Math.random() *
            rect.height,

          vx:
            (Math.random() - 0.5) *
            0.22,

          vy:
            (Math.random() - 0.5) *
            0.22
        })
      );
  }

  function animateCard() {
    if (
      reduced ||
      !settings.cardParticles ||
      !cardCanvas ||
      !cardCtx
    ) {
      cardFrame = null;
      return;
    }

    const rect =
      cardCanvas.getBoundingClientRect();

    cardCtx.clearRect(
      0,
      0,
      rect.width,
      rect.height
    );

    cardDots.forEach(
      (p, i) => {
        p.x += p.vx;
        p.y += p.vy;

        if (
          p.x < 0 ||
          p.x > rect.width
        ) {
          p.vx *= -1;
        }

        if (
          p.y < 0 ||
          p.y > rect.height
        ) {
          p.vy *= -1;
        }

        for (
          let j = i + 1;
          j < cardDots.length;
          j++
        ) {
          const q =
            cardDots[j];

          const dx =
            p.x - q.x;

          const dy =
            p.y - q.y;

          const distanceSquared =
            dx * dx +
            dy * dy;

          if (
            distanceSquared <
            6000
          ) {
            cardCtx.beginPath();

            cardCtx.strokeStyle =
              `rgba(255,37,69,${
                (
                  1 -
                  distanceSquared /
                    6000
                ) * 0.18
              })`;

            cardCtx.lineWidth =
              0.5;

            cardCtx.moveTo(
              p.x,
              p.y
            );

            cardCtx.lineTo(
              q.x,
              q.y
            );

            cardCtx.stroke();
          }
        }

        cardCtx.beginPath();

        cardCtx.fillStyle =
          'rgba(255,60,84,.42)';

        cardCtx.arc(
          p.x,
          p.y,
          1.1,
          0,
          Math.PI * 2
        );

        cardCtx.fill();
      }
    );

    cardFrame =
      requestAnimationFrame(
        animateCard
      );
  }

  function startCardAnimation() {
    if (
      reduced ||
      !settings.cardParticles ||
      cardFrame !== null
    ) {
      return;
    }

    cardFrame =
      requestAnimationFrame(
        animateCard
      );
  }

  function stopCardAnimation() {
    if (
      cardFrame !== null
    ) {
      cancelAnimationFrame(
        cardFrame
      );

      cardFrame = null;
    }

    cardDots = [];

    if (

    ) {
      const rect =
        cardCanvas.getBoundingClientRect();

      cardCtx.clearRect(
        0,
        0,
        rect.width,
        rect.height
      );
    }
  }

    switches.forEach(button => {
      const key =
        button.dataset.effect;

      if (!key) {
        return;
      }

      const enabled =
        !!settings[key];

      button.classList.toggle(
        'is-on',
        enabled
      );

      button.setAttribute(
        'aria-checked',
        enabled
          ? 'true'
          : 'false'
      );

      button.title =
        enabled
          ? `Turn off ${key}`
          : `Turn on ${key}`;
    });

    densityRange.value =
      String(
        settings.backgroundDensity
      );

    densityValue.textContent =
      String(
        settings.backgroundDensity
      );
  }

  /* ---------------------------------------------------------
     Individual switch control
     --------------------------------------------------------- */

  function setEffect(
    key,
    enabled
  ) {
    settings[key] =
      !!enabled;

    saveSettings();

    applyVisualSettings();
    updateSwitches();

    if (
      key ===
      'backgroundParticles'
    ) {
      if (
        settings.backgroundParticles
      ) {
        resizeParticles();
        startParticleAnimation();
      } else {
        stopParticleAnimation();
      }

      return;
    }

    if (
      key ===
      'cardParticles'
    ) {
      if (
        settings.cardParticles
      ) {
        resizeCard();
        startCardAnimation();
      } else {
        stopCardAnimation();
      }
    }
  }

  const switches =
    effectsPanel.querySelectorAll(
      '.vortx-switch'
    );

  switches.forEach(button => {
    button.addEventListener(
      'click',
      () => {
        const key =
          button.dataset.effect;

        if (!key) {
          return;
        }

        setEffect(
          key,
          !settings[key]
        );
      }
    );
  });

  /* ---------------------------------------------------------
     Density slider
     --------------------------------------------------------- */

  densityRange.addEventListener(
    'input',
    () => {
      settings.backgroundDensity =
        Number(
          densityRange.value
        );

      densityValue.textContent =
        String(
          settings.backgroundDensity
        );

      saveSettings();

      if (
        settings.backgroundParticles
      ) {
        resizeParticles();
      }
    }
  );

  /* ---------------------------------------------------------
     Reset settings
     --------------------------------------------------------- */

  resetButton.addEventListener(
    'click',
    () => {
      settings = {
        ...DEFAULT_SETTINGS
      };

      saveSettings();

      applyVisualSettings();
      updateSwitches();

      resizeParticles();
      resizeCard();

      stopParticleAnimation();
      stopCardAnimation();

      startParticleAnimation();
      startCardAnimation();
    }
  );

  /* ---------------------------------------------------------
     Settings menu open / close
     --------------------------------------------------------- */

  let settingsOpen = false;

  function setSettingsOpen(
    open
  ) {
    settingsOpen =
      !!open;

    effectsPanel.classList.toggle(
      'is-open',
      settingsOpen
    );

    settingsBtn.setAttribute(
      'aria-expanded',
      settingsOpen
        ? 'true'
        : 'false'
    );

    settingsBtn.textContent =
      settingsOpen
        ? '✕'
        : '⚙️';

    settingsBtn.title =
      settingsOpen
        ? 'Close Effects'
        : 'Open Effects';
  }

  settingsBtn.setAttribute(
    'aria-haspopup',
    'true'
  );

  settingsBtn.setAttribute(
    'aria-expanded',
    'false'
  );

  settingsBtn.addEventListener(
    'click',
    event => {
      event.stopPropagation();

      setSettingsOpen(
        !settingsOpen
      );
    }
  );

  document.addEventListener(
    'click',
    event => {
      if (
        settingsOpen &&
        !effectsPanel.contains(
          event.target
        ) &&
        event.target !==
          settingsBtn
      ) {
        setSettingsOpen(false);
      }
    }
  );

  document.addEventListener(
    'keydown',
    event => {
      if (
        event.key === 'Escape' &&
        settingsOpen
      ) {
        setSettingsOpen(false);
      }
    }
  );

  /* ---------------------------------------------------------
     Initial settings
     --------------------------------------------------------- */

  applyVisualSettings();
  updateSwitches();

  resizeParticles();
  resizeCard();

  startParticleAnimation();
  startCardAnimation();

  /* ---------------------------------------------------------
     Mouse interaction
     --------------------------------------------------------- */

  if (
    window.matchMedia(
      '(pointer:fine)'
    ).matches
  ) {
    window.addEventListener(
      'pointermove',
      event => {
        mouse.x =
          event.clientX;

        mouse.y =
          event.clientY;

        mouse.active =
          true;
      },
      {
        passive: true
      }
    );

    window.addEventListener(
      'pointerleave',
      () => {
        mouse.active =
          false;
      },
      {
        passive: true
      }
    );
  }

  /* ---------------------------------------------------------
     Robot
     --------------------------------------------------------- */

  const robot =
    document.querySelector(
      '#vortx-robot'
    );

  const compact =
    window.matchMedia(
      '(max-width:600px)'
    ).matches;

  let robotX =
    compact
      ? Math.max(
          0,
          window.innerWidth - 66
        )
      : Math.max(
          10,
          window.innerWidth - 86
        );

  let robotY =
    compact
      ? 6
      : Math.max(
          80,
          window.innerHeight - 100
        );

  let drag = null;

  function clampRobot() {
    if (!robot) {
      return;
    }

    const rect =
      robot.getBoundingClientRect();

    robotX =
      Math.min(
        Math.max(0, robotX),
        Math.max(
          0,
          window.innerWidth -
            rect.width
        )
      );

    robotY =
      Math.min(
        Math.max(0, robotY),
        Math.max(
          0,
          window.innerHeight -
            rect.height
        )
      );

    robot.style.left =
      `${robotX}px`;

    robot.style.top =
      `${robotY}px`;
  }

  if (robot) {
    clampRobot();

    robot.addEventListener(
      'pointerdown',
      event => {
        if (
          event.button !==
            undefined &&
          event.button !== 0
        ) {
          return;
        }

        const rect =
          robot.getBoundingClientRect();

        drag = {
          id:
            event.pointerId,

          offsetX:
            event.clientX -
            rect.left,

          offsetY:
            event.clientY -
            rect.top
        };

        robot.setPointerCapture(
          event.pointerId
        );

        robot.classList.add(
          'is-dragging'
        );

        event.preventDefault();
      }
    );

    robot.addEventListener(
      'pointermove',
      event => {
        if (
          !drag ||
          drag.id !==
            event.pointerId
        ) {
          return;
        }

        robotX =
          event.clientX -
          drag.offsetX;

        robotY =
          event.clientY -
          drag.offsetY;

        clampRobot();

        event.preventDefault();
      }
    );

    function endDrag(event) {
      if (
        !drag ||
        drag.id !==
          event.pointerId
      ) {
        return;
      }

      if (
        robot.hasPointerCapture(
          event.pointerId
        )
      ) {
        robot.releasePointerCapture(
          event.pointerId
        );
      }

      drag = null;

      robot.classList.remove(
        'is-dragging'
      );
    }

    robot.addEventListener(
      'pointerup',
      endDrag
    );

    robot.addEventListener(
      'pointercancel',
      endDrag
    );

    robot.addEventListener(
      'keydown',
      event => {
        const step =
          event.shiftKey
            ? 24
            : 12;

        if (
          event.key ===
          'ArrowLeft'
        ) {
          robotX -= step;
        } else if (
          event.key ===
          'ArrowRight'
        ) {
          robotX += step;
        } else if (
          event.key ===
          'ArrowUp'
        ) {
          robotY -= step;
        } else if (
          event.key ===
          'ArrowDown'
        ) {
          robotY += step;
        } else {
          return;
        }

        event.preventDefault();

        clampRobot();
      }
    );
  }

  /* ---------------------------------------------------------
     Resize
     --------------------------------------------------------- */

  window.addEventListener(
    'resize',
    () => {
      resizeParticles();
      resizeCard();
      clampRobot();
    },
    {
      passive: true
    }
  );

  /* ---------------------------------------------------------
     WhatsApp
     --------------------------------------------------------- */

  const whatsapp =
    document.querySelector(
      '#whatsapp-group'
    );

  if (whatsapp) {
    if (
      /^https?:\/\//.test(
        WHATSAPP_GROUP_URL
      )
    ) {
      whatsapp.href =
        WHATSAPP_GROUP_URL;
    } else {
      whatsapp.addEventListener(
        'click',
        event => {
          event.preventDefault();

          const status =
            document.querySelector(
              '#visitor-status'
            );

          if (status) {
            status.textContent =
              'WhatsApp group link coming soon';
          }
        }
      );
    }
  }

  /* ---------------------------------------------------------
     Visitor counter
     --------------------------------------------------------- */

  async function visitors() {
    const count =
      document.querySelector(
        '#visitor-count'
      );

    const status =
      document.querySelector(
        '#visitor-status'
      );

    if (
      !count ||
      !status
    ) {
      return;
    }

    const key =
      'vortx-visitor-count';

    let saved = null;

    try {
      saved =
        localStorage.getItem(
          key
        );
    } catch {
      saved = null;
    }

    if (saved) {
      count.textContent =
        saved;
    }

    try {
      const response =
        await fetch(
          counterEndpoint,
          {
            signal:
              AbortSignal.timeout(
                5000
              )
          }
        );

      if (!response.ok) {
        throw new Error(
          'Counter request failed'
        );
      }

      const data =
        await response.json();

      const total =
        data.count ??
        data.value;

      if (
        !Number.isFinite(
          total
        )
      ) {
        throw new Error(
          'Invalid counter value'
        );
      }

      const result =
        new Intl.NumberFormat()
          .format(total);

      count.textContent =
        result;

      try {
        localStorage.setItem(
          key,
          result
        );
      } catch {
        /* Ignore storage failure */
      }
    } catch {
      if (!saved) {
        count.textContent =
          '—';
      }

      status.textContent =
        saved
          ? 'Showing last saved count'
          : 'Stay Connected !';
    }
  }

  visitors();

  /* ---------------------------------------------------------
     Click flash
     --------------------------------------------------------- */

  document.addEventListener(
    'click',
    event => {
      if (
        event.target.closest(
          'a,#vortx-robot,#settings-toggle,#vortx-effects-panel'
        )
      ) {
        return;
      }

      if (!flash) {
        return;
      }

      flash.style.setProperty(
        '--flash-x',
        `${event.clientX}px`
      );

      flash.style.setProperty(
        '--flash-y',
        `${event.clientY}px`
      );

      flash.style.opacity =
        '1';

      window.setTimeout(
        () => {
          flash.style.opacity =
            '0';
        },
        130
      );
    }
  );

})();
</script>
</body>
</html>
